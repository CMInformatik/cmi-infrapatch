name: Claude-Rules

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions:
  contents: read
  pull-requests: read

jobs:
  claude_rules_validate:
    name: claude_rules_validate
    runs-on: ubuntu-latest
    steps:
      - name: Claude-Rules nicht lokal ändern
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          rule_files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files?per_page=100" \
            -q '.[] | select((.filename | startswith(".claude/rules/")) or ((.previous_filename // "") | startswith(".claude/rules/"))) | if .previous_filename then "\(.previous_filename) -> \(.filename)" else .filename end')

          if [[ -z ${rule_files} ]]; then
            echo "PR ändert .claude/rules/ nicht"
            exit 0
          fi

          echo "${rule_files}"
          echo "::error::Claude-Rules werden zentral in cmi-claude-infrastructure (rules/) gepflegt und von dort verteilt. Änderungen an .claude/rules/ aus diesem PR entfernen."
          exit 1
