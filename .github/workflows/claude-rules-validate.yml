name: Claude-Rules

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .claude/rules/**

permissions: {}

jobs:
  claude_rules_validate:
    name: claude_rules_validate
    runs-on: ubuntu-latest
    steps:
      - name: Claude-Rules nicht lokal ändern
        env:
          GH_TOKEN: ${{ secrets.CMI_GITHUBTOKEN_RW }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -o pipefail

          cmiapps_review_state=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json latestReviews \
            -q '.latestReviews[] | select(.author.login == "cmiapps") | .state')

          if [[ ${cmiapps_review_state} == "CHANGES_REQUESTED" ]]; then
            echo "Änderungen bereits angefordert"
            exit 0
          fi

          gh pr review "$PR" --repo "$GITHUB_REPOSITORY" --request-changes --body "Claude-Rules werden zentral in cmi-github-infrastructure gepflegt und von dort verteilt."
